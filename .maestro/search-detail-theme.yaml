# Better Maestro flow: search field is a TextInput with placeholder
appId: com.githubexplorer
---
- launchApp
- assertVisible: 'GitHub Explorer'
- tapOn: 'Search repositories'
- inputText: 'react-native'
- hideKeyboard
- extendedWaitUntil:
    visible: 'facebook/react-native'
    timeout: 15000
- tapOn: 'facebook/react-native'
- extendedWaitUntil:
    visible: 'Open on GitHub'
    timeout: 15000
- tapOn: 'Dark'
- assertVisible: 'Open on GitHub'
